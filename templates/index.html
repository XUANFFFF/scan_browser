<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫描文件浏览器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Warm-tinted neutrals — like aged paper */
    --surface-0: oklch(0.985 0.002 90);
    --surface-1: oklch(0.975 0.003 90);
    --surface-2: oklch(0.96 0.004 90);
    --border: oklch(0.90 0.004 90);
    --border-light: oklch(0.93 0.003 90);

    /* Text */
    --text-primary: oklch(0.22 0.01 270);
    --text-secondary: oklch(0.48 0.01 270);
    --text-tertiary: oklch(0.65 0.005 270);

    /* Muted teal accent — like a classic office notebook */
    --accent: oklch(0.55 0.12 215);
    --accent-hover: oklch(0.48 0.12 215);
    --accent-bg: oklch(0.92 0.025 215);
    --accent-ring: oklch(0.55 0.12 215 / 0.25);

    /* Today highlight — warm amber wash */
    --today-bg: oklch(0.94 0.04 95);
    --today-dot: oklch(0.58 0.12 95);

    /* Sizing */
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --space-10: 40px;
    --space-12: 48px;
    --space-14: 56px;
    --space-16: 64px;
  }

  body {
    font-family: "Spline Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Shell ── */
  .shell {
    max-width: 880px;
    margin: 0 auto;
    width: 100%;
    padding: 0 var(--space-5);
    flex: 1;
  }

  /* ── Header ── */
  .header {
    padding: var(--space-14) 0 var(--space-8);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--space-4);
  }
  .header-title {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--text-primary);
  }
  .header-sub {
    font-family: "Geist Mono", "Consolas", monospace;
    font-size: 0.8125rem;
    font-weight: 400;
    color: var(--text-tertiary);
    margin-top: var(--space-1);
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .header-sub::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: oklch(0.55 0.15 140);
    display: inline-block;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    flex-shrink: 0;
  }
  .stat-label {
    font-size: 0.8125rem;
    color: var(--text-tertiary);
    white-space: nowrap;
  }
  .stat-label strong {
    color: var(--text-primary);
    font-weight: 600;
  }
  .btn-refresh {
    background: var(--surface-2);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-sm);
    font-size: 0.8125rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    white-space: nowrap;
  }
  .btn-refresh:hover {
    background: var(--border-light);
    color: var(--text-primary);
  }
  .btn-refresh:active { transform: scale(0.97); }
  .btn-refresh:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Loading ── */
  .loading-wrap {
    padding: var(--space-12) 0;
    text-align: center;
  }
  .loading-pulse {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
    margin-right: var(--space-2);
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }
  .loading-text {
    font-size: 0.8125rem;
    color: var(--text-tertiary);
    vertical-align: middle;
  }

  /* ── Section headers ── */
  .section {
    margin-bottom: var(--space-4);
  }
  .section-label {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-4) 0 var(--space-2);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    user-select: none;
  }
  .section-label .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--today-dot);
  }
  .section-history .dot { background: var(--text-tertiary); }
  .section-label .count {
    font-weight: 400;
    margin-left: auto;
    color: var(--text-tertiary);
    letter-spacing: 0;
    text-transform: none;
    font-size: 0.75rem;
  }

  /* ── Date group label ── */
  .date-group {
    font-family: "Geist Mono", "Consolas", monospace;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-tertiary);
    padding: var(--space-4) 0 var(--space-2);
    opacity: 0.8;
  }

  /* ── Empty state ── */
  .empty-note {
    padding: var(--space-5) 0;
    font-size: 0.875rem;
    color: var(--text-tertiary);
    font-style: italic;
  }

  /* ── File row ── */
  .file-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    transition: background 0.12s ease;
    cursor: default;
    position: relative;
  }
  .file-row:hover { background: var(--surface-2); }
  
  .file-cell { min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }
  .file-name {
    font-size: 1rem;
    font-weight: 500;
    color: var(--text-primary);
    word-break: break-all;
    line-height: 1.45;
  }
  .file-meta {
    font-size: 0.8125rem;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: var(--space-3);
    flex-wrap: wrap;
  }
  .file-meta time {
    font-family: "Geist Mono", "Consolas", monospace;
    font-size: 0.75rem;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .file-meta .size {
    font-size: 0.75rem;
  }

  /* Today row treatment */
  .file-row.today { background: var(--today-bg); }
  .file-row.today:hover { background: oklch(0.91 0.05 95); }

  /* Active (just-clicked) row */
  .file-row.previewed .file-name { color: var(--accent); }

  /* ── Action buttons ── */
  .actions {
    display: flex;
    gap: var(--space-1);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .file-row:hover .actions,
  .file-row:focus-within .actions { opacity: 1; }
  .actions.always-visible { opacity: 0.6; }
  .file-row:hover .actions.always-visible { opacity: 1; }

  .btn-action {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-sm);
    font-size: 0.8125rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .btn-action:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn-preview {
    background: var(--accent-bg);
    color: var(--accent);
  }
  .btn-preview:hover { background: var(--accent); color: #fff; }
  .btn-preview:active { transform: scale(0.96); }
  .btn-download {
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  .btn-download:hover {
    background: var(--text-primary);
    color: var(--surface-0);
  }
  .btn-download:active { transform: scale(0.96); }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: var(--space-10) 0 var(--space-8);
    font-size: 0.75rem;
    color: var(--text-tertiary);
    opacity: 0.7;
  }
  .footer time { font-family: "Geist Mono", "Consolas", monospace; }

  /* ── Error ── */
  .error-box {
    padding: var(--space-6);
    text-align: center;
    color: oklch(0.45 0.17 25);
    font-size: 0.9375rem;
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .shell { padding: 0 var(--space-4); }
    .header { flex-direction: column; align-items: flex-start; padding: var(--space-6) 0 var(--space-4); }
    .toolbar { width: 100%; justify-content: space-between; }
    .file-row { grid-template-columns: 1fr; padding: var(--space-3); }
    .actions { opacity: 1; margin-top: var(--space-2); }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="header">
    <div>
      <h1 class="header-title">扫描文件</h1>
      <div class="header-sub" id="headerPath">—</div>
    </div>
    <div class="toolbar">
      <span class="stat-label" id="stats">—</span>
      <button class="btn-refresh" id="refreshBtn" onclick="loadList()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        刷新
      </button>
    </div>
  </header>

  <main>
    <div id="loadingView" class="loading-wrap">
      <span class="loading-pulse"></span>
      <span class="loading-text">正在读取扫描文件列表</span>
    </div>
    <div id="listView" style="display:none"></div>
  </main>

  <footer class="footer" id="footer"></footer>
</div>

<script>
const BASE = window.location.origin;
let _lastPreviewed = null;
let _loading = false;

function fmtSize(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(1) + " MB";
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function isToday(fn) {
  var m = fn.match(/^(\d{8})\d{6}/);
  if (!m) return false;
  var d = new Date();
  return m[1] === String(d.getFullYear()) + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
}

function extractTime(fn) {
  var m = fn.match(/^\d{8}(\d{2})(\d{2})/);
  return m ? m[1] + ":" + m[2] : null;
}

function makeRow(f, showTime) {
  var cls = isToday(f.name) ? "file-row today" : "file-row";
  if (f.name === _lastPreviewed) cls += " previewed";
  var timeStr = showTime ? '<time>' + esc(extractTime(f.name)) + '</time>' : '';
  return '<div class="' + cls + '">' +
    '<div class="file-cell">' +
      '<span class="file-name">' + esc(f.name) + '</span>' +
      '<span class="file-meta">' + timeStr + '<span class="size">' + esc(f.size_display) + '</span><span>' + esc(f.date) + '</span></span>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn-action btn-preview" data-f="' + esc(f.name) + '">预览</button>' +
      '<button class="btn-action btn-download" data-f="' + esc(f.name) + '">下载</button>' +
    '</div>' +
  '</div>';
}

async function loadList() {
  if (_loading) return;
  _loading = true;
  var btn = document.getElementById("refreshBtn");
  btn.disabled = true;

  document.getElementById("loadingView").style.display = "block";
  document.getElementById("listView").style.display = "none";

  try {
    var r = await fetch(BASE + "/api/files");
    var d = await r.json();
    if (!d.success) throw new Error(d.error);

    var files = d.files.filter(function(f) { return f.name.endsWith(".pdf"); });
    var today = [], hist = [];
    files.forEach(function(f) {
      if (isToday(f.name)) today.push(f); else hist.push(f);
    });
    today.sort(function(a,b) { return b.name.localeCompare(a.name); });
    hist.sort(function(a,b) { return b.name.localeCompare(a.name); });

    var h = "";

    // Today
    h += '<div class="section"><div class="section-label"><span class="dot"></span> 今日扫描<span class="count">' + today.length + '</span></div>';
    if (today.length === 0) {
      h += '<div class="empty-note">暂无今日扫描文件</div>';
    } else {
      today.forEach(function(f) { h += makeRow(f, true); });
    }
    h += '</div>';

    // History
    h += '<div class="section section-history"><div class="section-label"><span class="dot"></span> 历史记录<span class="count">' + hist.length + '</span></div>';
    if (hist.length === 0) {
      h += '<div class="empty-note">暂无历史扫描文件</div>';
    } else {
      var lastDate = "";
      hist.forEach(function(f) {
        var dk = f.name.substring(0,8);
        if (dk !== lastDate) {
          lastDate = dk;
          h += '<div class="date-group">' + dk.substring(0,4) + '-' + dk.substring(4,6) + '-' + dk.substring(6,8) + '</div>';
        }
        h += makeRow(f, false);
      });
    }
    h += '</div>';

    var el = document.getElementById("listView");
    el.innerHTML = h;

    // Bind events
    el.querySelectorAll(".btn-preview").forEach(function(b) {
      b.addEventListener("click", function(e) {
        e.stopPropagation();
        doPreview(b.dataset.f);
      });
    });
    el.querySelectorAll(".btn-download").forEach(function(b) {
      b.addEventListener("click", function(e) {
        e.stopPropagation();
        doDownload(b.dataset.f);
      });
    });

    var total = files.reduce(function(s,f) { return s + f.size; }, 0);
    document.getElementById("stats").innerHTML = '<strong>' + files.length + '</strong> 个文件 &middot; ' + fmtSize(total);
    document.getElementById("footer").innerHTML = '最后刷新 <time>' + new Date().toLocaleTimeString("zh-CN") + '</time>';
    el.style.display = "";
  } catch(e) {
    document.getElementById("listView").innerHTML = '<div class="error-box">' + esc(e.message) + '</div>';
    document.getElementById("listView").style.display = "";
  }

  document.getElementById("loadingView").style.display = "none";
  btn.disabled = false;
  _loading = false;
}

function doPreview(fn) {
  _lastPreviewed = fn;
  // Refresh visual highlight
  document.querySelectorAll(".file-row").forEach(function(el) {
    var b = el.querySelector(".btn-preview");
    el.classList.toggle("previewed", b && b.dataset.f === fn);
  });
  window.open(BASE + "/api/preview/" + encodeURIComponent(fn), "_blank");
}

function doDownload(fn) {
  window.open(BASE + "/api/download/" + encodeURIComponent(fn));
}

// Load server config (path display)
fetch(BASE + "/api/config")
  .then(function(r) { return r.json(); })
  .then(function(cfg) {
    document.getElementById("headerPath").textContent = cfg.smb_host + " / " + cfg.smb_share;
  });

// Initial load
loadList();
</script>
</body>
</html>
